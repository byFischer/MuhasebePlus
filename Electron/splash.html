<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>MuhasebePlus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b0e16;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .logo span { color: #ff2f45; }
    .subtitle {
      font-size: 0.85rem;
      color: #a9b2c0;
      letter-spacing: 0.5px;
    }
    .loader {
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar {
      position: absolute;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #ff2f45, transparent);
      animation: slide 1.4s infinite ease-in-out;
    }
    @keyframes slide {
      0%   { left: -60%; }
      100% { left: 110%; }
    }
    .version { font-size: 0.7rem; color: rgba(255,255,255,0.25); position: absolute; bottom: 18px; }
  </style>
</head>
<body>
  <div class="logo">Muhasebe<span>+</span></div>
  <div class="subtitle">Başlatılıyor, lütfen bekleyin...</div>
  <div class="loader"><div class="loader-bar"></div></div>
  <div class="version">v1.0.0</div>
</body>
</html>
