spring.application.name=MuhasebePlus

# EmbeddedPostgresConfig bu URL'i runtime'da override eder
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.out-of-order=true

server.port=8080
logging.level.org.springframework.security=WARN
logging.level.root=INFO

# Mail devre disi (desktop'ta SMTP yok)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
management.health.mail.enabled=false

# JWT secret — Electron tarafindan env ile inject edilir
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Rapor dosyalari — kullanici home klasorunde
app.report.storage-path=${user.home}/MuhasebePlus/reports/

# AI — kullanici Settings'ten girer; bos birakilirsa AI feature disabled
app.ai.gemini-api-key=
app.ai.gemini-model=gemini-2.5-flash
app.ai.monthly-token-budget=200000
app.ai.daily-brief-cache-hours=24
