spring.application.name=MuhasebePlus

# EmbeddedPostgresConfig bu URL'i runtime'da override eder
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true

server.port=8080
logging.level.org.springframework.security=WARN
logging.level.root=INFO

# Mail devre disi (desktop'ta SMTP yok)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
management.health.mail.enabled=false

# Encryption — APP_ENCRYPTION_KEY: Base64 encoded 32-byte key
app.encryption.key=${APP_ENCRYPTION_KEY}

# GIB E-Fatura
gib.endpoint.url=https://efaturatest.efatura.gov.tr/earsiv/ws/EarsivWebService
gib.connect-timeout=15000
gib.read-timeout=15000

# JWT secret — Electron tarafindan env ile inject edilir
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Rapor dosyalari — kullanici home klasorunde
app.report.storage-path=${user.home}/MuhasebePlus/reports/

# AI — application properties veya GEMINI_API_KEY ile girilir; bos birakilirsa AI feature disabled
app.ai.gemini-api-key=
app.ai.gemini-model=gemini-2.5-flash
app.ai.monthly-token-budget=200000
app.ai.daily-brief-cache-hours=24
