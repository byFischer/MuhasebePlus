spring.application.name=MuhasebePlus

spring.datasource.url=DB_URL
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.out-of-order=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8080

logging.level.org.springframework.security=DEBUG

jwt.secret=JWT_SECRET
jwt.expiration=JWT_EXPIRATION

# Report storage (Apache POI Excel)
app.report.storage-path=./reports/

# AI - Gemini Flash
app.ai.gemini-api-key=GEMINI_API_KEY
app.ai.gemini-model=gemini-2.5-flash
app.ai.monthly-token-budget=200000
app.ai.daily-brief-cache-hours=24

# MAIL CONFIG
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:127.0.0.1}
spring.mail.properties.mail.smtp.localhost=${MAIL_LOCALHOST:localhost}

