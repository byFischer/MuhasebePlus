spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.application.name=MuhasebePlus

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/muhasebe_plus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=8080

logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Report storage (Apache POI Excel)
app.report.storage-path=./reports/
app.report.top-n=10
app.report.excel.max-rows=10000

# Security
app.security.max-login-attempts=5

# İlk admin hesabı — sadece sistemde hiç ADMIN yokken açılışta oluşturulur (bkz. AdminBootstrap)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Dynamic query (dashboard widgets)
app.dynamic-query.default-limit=100
app.dynamic-query.max-limit=1000

# AI - Gemini Flash
app.ai.gemini-api-key=${GEMINI_API_KEY}
app.ai.gemini-model=gemini-2.5-flash
app.ai.monthly-token-budget=200000
app.ai.gemini.temperature=0.2
app.ai.gemini.widget.max-output-tokens=1024
app.ai.gemini.chat.max-output-tokens=8192
app.ai.daily-brief-cache-hours=24

# Encryption — APP_ENCRYPTION_KEY: Base64 encoded 32-byte key (openssl rand -base64 32)
app.encryption.key=${APP_ENCRYPTION_KEY}

# GIB E-Fatura
gib.endpoint.url=https://efaturatest.efatura.gov.tr/earsiv/ws/EarsivWebService
gib.connect-timeout=15000
gib.read-timeout=15000

# MAIL CONFIG
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:127.0.0.1}
spring.mail.properties.mail.smtp.localhost=${MAIL_LOCALHOST:localhost}
