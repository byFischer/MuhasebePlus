spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true

jwt.secret=test-secret-key-for-junit-tests-32chars!
jwt.expiration=3600000

# Test encryption key (Base64 of 32 zero-bytes — test only)
app.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# GIB
gib.endpoint.url=https://efaturatest.efatura.gov.tr/earsiv/ws/EarsivWebService
gib.connect-timeout=15000
gib.read-timeout=15000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

logging.level.org.springframework.security=WARN
